name: ci

on:
  push:
  pull_request:

jobs:
  no-vendor-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-vendor-files.sh
      - run: shellcheck -x install.bash scripts/*.sh .claude/skills/*/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python .claude/skills/release/check_wheel.py dist/gcam_mvsdk_py-*
        shell: bash
      - run: gcam-mvsdk-py --help
